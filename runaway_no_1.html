<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Decision</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: #ffd6e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .box {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 50px 40px;
    width: 420px;
    text-align: center;
    position: relative;
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 40px;
    line-height: 1.4;
  }
  .options {
    position: relative;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  button {
    padding: 14px 34px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #yes {
    background: #4caf50;
    color: white;
  }
  #yes:hover {
    background: #43a047;
  }
  #no {
    background: #e53935;
    color: white;
    position: relative;
  }
  #msg {
    margin-top: 25px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
  @keyframes confetti-fall {
    0% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0.9;
    }
    100% {
      transform: translate(var(--drift), 100vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="box">
  <h1>WILL YOU LET YOUR SON BUY A 10,000 RUPEES WATCH?</h1>
  <div class="options" id="optionsArea">
    <button id="yes" onclick="sayYes()">YES</button>
    <button id="no">NO</button>
  </div>
  <div id="msg"></div>
</div>

<script>
  const noBtn = document.getElementById('no');
  const area = document.getElementById('optionsArea');
  const msg = document.getElementById('msg');
  let dodges = 0;

  const excuses = [
    "Nope, try again!",
    "Not so fast!",
    "Catch me if you can!",
    "A father's love has no limit!",
    "You can't say no to this!",
    "Almost caught me!",
    "Still no!"
  ];

  function moveNoButton() {
    const areaRect = area.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    // switch to absolute positioning (relative to the options area) the first time it dodges
    if (noBtn.style.position !== 'absolute') {
      const noRect = noBtn.getBoundingClientRect();
      noBtn.style.position = 'absolute';
      noBtn.style.left = (noRect.left - areaRect.left) + "px";
      noBtn.style.top = (noRect.top - areaRect.top) + "px";
    }

    const maxX = areaRect.width - btnW;
    const maxY = 200;

    const newX = Math.random() * maxX;
    const newY = (Math.random() * maxY) - (maxY / 2);

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    dodges++;
    msg.textContent = excuses[dodges % excuses.length];
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveNoButton();
  });

  function sayYes() {
    document.querySelector('.box').innerHTML =
      "<div style='display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;'>" +
      "<div style='font-size:28px; font-weight:bold; color:#333;'>YESSSSS HURRRAY!!!!!!!!!!!!!!!!!!!!!!!!!!!!1</div>" +
      "<div style='font-size:22px; font-weight:bold; color:#333;'>Your son is going to remember this moment forever.</div>" +
      "</div>";
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#e53935', '#4caf50', '#2196f3', '#ffeb3b', '#ff9800', '#e91e63', '#9c27b0'];
    const pieceCount = 120;

    for (let i = 0; i < pieceCount; i++) {
      const piece = document.createElement('div');
      const size = 6 + Math.random() * 6;
      const startX = Math.random() * window.innerWidth;
      const drift = (Math.random() - 0.5) * 200;
      const duration = 2.5 + Math.random() * 1.5;
      const delay = Math.random() * 0.5;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const shape = Math.random() > 0.5 ? '50%' : '2px';

      piece.style.position = 'fixed';
      piece.style.top = '-20px';
      piece.style.left = startX + 'px';
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.background = color;
      piece.style.borderRadius = shape;
      piece.style.opacity = '0.9';
      piece.style.pointerEvents = 'none';
      piece.style.zIndex = '9999';
      piece.style.setProperty('--drift', drift + 'px');
      piece.style.animation = `confetti-fall ${duration}s ease-in ${delay}s forwards`;

      document.body.appendChild(piece);

      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 100);
    }
  }
</script>

</body>
</html>
