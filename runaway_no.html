<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Decision</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: #ffd6e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .box {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 50px 40px;
    width: 420px;
    text-align: center;
    position: relative;
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 40px;
    line-height: 1.4;
  }
  .options {
    position: relative;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  button {
    padding: 14px 34px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #yes {
    background: #4caf50;
    color: white;
  }
  #yes:hover {
    background: #43a047;
  }
  #no {
    background: #e53935;
    color: white;
    position: relative;
  }
  #msg {
    margin-top: 25px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
</style>
</head>
<body>

<div class="box">
  <h1>WILL YOU LET YOUR SON BUY A 10,000 RUPEES WATCH?</h1>
  <div class="options" id="optionsArea">
    <button id="yes" onclick="sayYes()">YES</button>
    <button id="no">NO</button>
  </div>
  <div id="msg"></div>
</div>

<script>
  const noBtn = document.getElementById('no');
  const area = document.getElementById('optionsArea');
  const msg = document.getElementById('msg');
  let dodges = 0;

  const excuses = [
    "Nope, try again!",
    "Not so fast!",
    "Catch me if you can!",
    "A father's love has no limit!",
    "You can't say no to this!",
    "Almost caught me!",
    "Still no!"
  ];

  function moveNoButton() {
    const areaRect = area.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    // switch to absolute positioning (relative to the options area) the first time it dodges
    if (noBtn.style.position !== 'absolute') {
      const noRect = noBtn.getBoundingClientRect();
      noBtn.style.position = 'absolute';
      noBtn.style.left = (noRect.left - areaRect.left) + "px";
      noBtn.style.top = (noRect.top - areaRect.top) + "px";
    }

    const maxX = areaRect.width - btnW;
    const maxY = 200;

    const newX = Math.random() * maxX;
    const newY = (Math.random() * maxY) - (maxY / 2);

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    dodges++;
    msg.textContent = excuses[dodges % excuses.length];
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveNoButton();
  });

  function sayYes() {
    msg.innerHTML = "YESSSSS HURRRAY!!!!!!!!!!!!!!!!!!!!!!!!!!!!1<br><span style='display:block; text-align:center; font-size:13px; color:#999; margin-top:6px; font-weight:bold;'>Your son is going to remember this moment forever.</span>";
  }
</script>

</body>
</html>
